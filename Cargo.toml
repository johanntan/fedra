[package]
name = "fedra"
version = "0.6.0"
edition = "2024"
rust-version = "1.88.0"

[workspace]
members = ["xtask"]

[dependencies]
accesskit = "0.25.1"
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-humanize = "0.2.3"
clearurls = "0.0.4"
ego-tree = "0.11.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
key-chord = "0.1.0"
minijinja = { version = "2.24.0", default-features = false, features = ["macros", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "stream", "json", "multipart", "form", "rustls-no-provider"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp4", "mp3", "vorbis", "wav", "flac"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
scraper = { version = "0.27.0", default-features = false, features = ["errors"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ship-shape = "0.2.0"
tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
url = "2.5.8"
wx-utils = { version = "0.3.1", features = ["shortcuts"] }
wxdragon = { version = "0.9.22", features = ["webview"] }

[target.'cfg(windows)'.dependencies]
accesskit_windows = "0.35.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-manifest = "1.5.1"
winres = "0.1.12"

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
