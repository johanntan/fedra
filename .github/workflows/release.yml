name: Release Fedra
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy
    - name: Install CMake, Ninja, and minisign
      run: |
        choco install cmake ninja minisign -y
    # Fedra builds against wxWidgets master for fixes that aren't in a release yet.
    # The clone is cached per master commit, so a new commit is picked up on the next run.
    - name: Find wxWidgets master
      id: wxwidgets
      shell: bash
      run: echo "sha=$(git ls-remote https://github.com/wxWidgets/wxWidgets.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
    - name: Cache wxWidgets source
      id: wxwidgets-cache
      uses: actions/cache@v4
      with:
        path: wxWidgets
        key: wxwidgets-src-${{ steps.wxwidgets.outputs.sha }}
    - name: Clone wxWidgets master
      if: steps.wxwidgets-cache.outputs.cache-hit != 'true'
      run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/wxWidgets/wxWidgets.git
    - name: Build
      env:
        WXWIDGETS_DIR: ${{ github.workspace }}/wxWidgets
      run: |
        cargo release
    - name: Sign artifacts
      shell: pwsh
      env:
        MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      run: |
        $keyPath = Join-Path $env:RUNNER_TEMP "fedra.key"
        [IO.File]::WriteAllText($keyPath, $env:MINISIGN_KEY)
        $pwPath = Join-Path $env:RUNNER_TEMP "fedra.pw"
        [IO.File]::WriteAllText($pwPath, $env:MINISIGN_PASSWORD)
        Get-Content $pwPath | minisign -S -s $keyPath -m target/release/fedra_setup-${{ matrix.arch }}.exe
        Get-Content $pwPath | minisign -S -s $keyPath -m target/release/fedra-${{ matrix.arch }}.zip
        Remove-Item $keyPath, $pwPath
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fedra-release-${{ github.ref_name }}-${{ matrix.arch }}
        path: |
          target/release/fedra-${{ matrix.arch }}.zip
          target/release/fedra-${{ matrix.arch }}.zip.minisig
          target/release/fedra_setup-${{ matrix.arch }}.exe
          target/release/fedra_setup-${{ matrix.arch }}.exe.minisig
        retention-days: 90
  build-macos:
    name: Build (macOS arm64)
    runs-on: macos-latest
    # Code signing and notarization run only when their secrets are set. Without them the DMG
    # still builds, but Gatekeeper makes people allow Fedra in System Settings on first launch.
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
    - name: Install CMake, Ninja, and minisign
      run: brew install cmake ninja minisign
    - name: Find wxWidgets master
      id: wxwidgets
      run: echo "sha=$(git ls-remote https://github.com/wxWidgets/wxWidgets.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
    - name: Cache wxWidgets source
      id: wxwidgets-cache
      uses: actions/cache@v4
      with:
        path: wxWidgets
        key: wxwidgets-src-${{ steps.wxwidgets.outputs.sha }}
    - name: Clone wxWidgets master
      if: steps.wxwidgets-cache.outputs.cache-hit != 'true'
      run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/wxWidgets/wxWidgets.git
    - name: Import signing certificate
      if: env.MACOS_CERTIFICATE_P12_BASE64 != ''
      env:
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      run: |
        CERT_PATH="$RUNNER_TEMP/fedra-signing.p12"
        KEYCHAIN_PATH="$RUNNER_TEMP/fedra-signing.keychain-db"
        echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D -o "$CERT_PATH"
        security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
        if [ -z "$IDENTITY" ]; then
          echo "No Developer ID Application identity found in the imported certificate" >&2
          exit 1
        fi
        echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
        echo "MACOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
        rm -f "$CERT_PATH"
    - name: Build
      env:
        WXWIDGETS_DIR: ${{ github.workspace }}/wxWidgets
        MACOSX_DEPLOYMENT_TARGET: "13.0"
      run: cargo release
    - name: Notarize and staple DMG
      if: env.MACOS_CERTIFICATE_P12_BASE64 != '' && env.APPSTORE_API_KEY_BASE64 != ''
      env:
        APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      run: |
        KEY_ID=$(printf '%s' "$APPSTORE_API_KEY_ID" | tr -d '[:space:]')
        ISSUER_ID=$(printf '%s' "$APPSTORE_API_ISSUER_ID" | tr -d '[:space:]')
        KEY_PATH="$RUNNER_TEMP/AppStoreConnectAPIKey.p8"
        echo "$APPSTORE_API_KEY_BASE64" | base64 -D -o "$KEY_PATH"
        set +e
        xcrun notarytool submit target/release/fedra-arm64.dmg \
          --key "$KEY_PATH" --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
          --wait --output-format json | tee notarization-result.json
        SUBMIT_STATUS=$?
        set -e
        SUBMISSION_ID=$(jq -r '.id // empty' notarization-result.json)
        RESULT=$(jq -r '.status // empty' notarization-result.json)
        if [ "$SUBMIT_STATUS" -ne 0 ] || [ "$RESULT" != "Accepted" ]; then
          if [ -n "$SUBMISSION_ID" ]; then
            xcrun notarytool log "$SUBMISSION_ID" --key "$KEY_PATH" --key-id "$KEY_ID" --issuer "$ISSUER_ID"
          fi
          rm -f "$KEY_PATH"
          exit 1
        fi
        xcrun stapler staple target/release/fedra-arm64.dmg
        rm -f "$KEY_PATH"
    - name: Sign artifacts
      env:
        MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      run: |
        KEY_PATH="$RUNNER_TEMP/fedra.key"
        printf '%s' "$MINISIGN_KEY" > "$KEY_PATH"
        printf '%s' "$MINISIGN_PASSWORD" | minisign -S -s "$KEY_PATH" -m target/release/fedra-arm64.dmg
        rm -f "$KEY_PATH"
    - name: Clean up signing keychain
      if: always() && env.MACOS_KEYCHAIN_PATH != ''
      run: security delete-keychain "$MACOS_KEYCHAIN_PATH" || true
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fedra-release-${{ github.ref_name }}-macos
        path: |
          target/release/fedra-arm64.dmg
          target/release/fedra-arm64.dmg.minisig
        retention-days: 90
  release:
    name: Publish release
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: fedra-release-${{ github.ref_name }}-*
        path: dist
        merge-multiple: true
    - name: Get previous tag
      id: prev_tag
      run: |
        PREV=$(git tag --sort=-version:refname | grep -v "^${{ github.ref_name }}$" | head -n 1 || echo "")
        echo "tag=$PREV" >> $GITHUB_OUTPUT
    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        files: dist/*
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
