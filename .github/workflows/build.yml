name: Build Fedra
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy
    - name: Install CMake, Ninja, and Pandoc
      run: |
        choco install cmake ninja pandoc minisign -y
    # Fedra builds against wxWidgets master for fixes that aren't in a release yet.
    # The clone is cached per master commit, so a new commit is picked up on the next run.
    - name: Find wxWidgets master
      id: wxwidgets
      shell: bash
      run: echo "sha=$(git ls-remote https://github.com/wxWidgets/wxWidgets.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
    - name: Cache wxWidgets source
      id: wxwidgets-cache
      uses: actions/cache@v4
      with:
        path: wxWidgets
        key: wxwidgets-src-${{ steps.wxwidgets.outputs.sha }}
    - name: Clone wxWidgets master
      if: steps.wxwidgets-cache.outputs.cache-hit != 'true'
      run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/wxWidgets/wxWidgets.git
    - name: Build
      env:
        WXWIDGETS_DIR: ${{ github.workspace }}/wxWidgets
      run: |
        cargo release
    - name: Sign artifacts
      shell: pwsh
      env:
        MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      run: |
        $keyPath = Join-Path $env:RUNNER_TEMP "fedra.key"
        [IO.File]::WriteAllText($keyPath, $env:MINISIGN_KEY)
        $pwPath = Join-Path $env:RUNNER_TEMP "fedra.pw"
        [IO.File]::WriteAllText($pwPath, $env:MINISIGN_PASSWORD)
        Get-Content $pwPath | minisign -S -s $keyPath -m target/release/fedra_setup-${{ matrix.arch }}.exe
        Get-Content $pwPath | minisign -S -s $keyPath -m target/release/fedra-${{ matrix.arch }}.zip
        Remove-Item $keyPath, $pwPath
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fedra-build-${{ matrix.arch }}
        path: |
          target/release/fedra-${{ matrix.arch }}.zip
          target/release/fedra-${{ matrix.arch }}.zip.minisig
          target/release/fedra_setup-${{ matrix.arch }}.exe
          target/release/fedra_setup-${{ matrix.arch }}.exe.minisig
        retention-days: 30
  publish:
    name: Publish latest release
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: fedra-build-*
        path: dist
        merge-multiple: true
    - name: Get latest tag reachable from HEAD
      id: get_tag
      run: |
        TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        echo "tag=$TAG" >> $GITHUB_OUTPUT
    - name: Generate release notes
      id: release_notes
      run: |
        PREV_TAG="${{ steps.get_tag.outputs.tag }}"
        if [ -z "$PREV_TAG" ]; then
          COMMITS=$(git log -1 --pretty=format:"- %h: %s" HEAD)
        else
          COMMITS=$(git log --pretty=format:"- %h: %s" "$PREV_TAG"..HEAD)
        fi
        COMMITS="${COMMITS//'%'/'%25'}"
        echo "commits<<EOF" >> $GITHUB_OUTPUT
        echo "$COMMITS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    - name: Create or update latest release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        name: Development Build
        body: |
          ## Commits since last release
          ${{ steps.release_notes.outputs.commits }}
        files: dist/*
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
